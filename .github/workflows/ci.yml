name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s integration/brain -v
      - run: python3 -m unittest discover -s integration/voice -v
      - run: python3 scripts/test_installed_skill.py
      - run: python3 scripts/test_launchd_upgrade.py
      - run: bash -n scripts/install.sh scripts/release.sh
      - run: scripts/release.sh 0.0.0-ci
