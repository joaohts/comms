name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s integration/brain -v
      - run: python3 -m unittest discover -s integration/voice -v
      - run: python3 scripts/test_installed_skill.py
      - run: python3 scripts/test_codex_alias.py
      - run: python3 scripts/test_launchd_upgrade.py
      - run: python3 scripts/test_service_key_install.py
      - name: Build platform archives and checksums
        run: scripts/release.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/comms_*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes "${flags[@]}"
